name: preset-daily-work
version: 0.0.1
description: 日常業務向けプリセット。
author: sori883
dependencies:
  apm:
    - sori883/ai-dotfiles/agents/doc-updater.agent.md
    - sori883/ai-dotfiles/agents/orchestrator.agent.md
    - sori883/ai-dotfiles/agents/planner.agent.md
    - sori883/ai-dotfiles/instructions/proactive-subagents-skills.instructions.md
    - sori883/ai-dotfiles/prompts/blog-review.prompt.md
    - sori883/ai-dotfiles/skills/docs-review
    - sori883/ai-dotfiles/skills/docs-write
    - sori883/ai-dotfiles/skills/empirical-prompt-tuning
    - sori883/ai-dotfiles/skills/gws-calendar
    - sori883/ai-dotfiles/skills/image-compressor
    - sori883/ai-dotfiles/skills/playwright-cli
  mcp:
    - name: serena
      registry: false
      transport: stdio
      command: uvx
      args:
        - --from
        - git+https://github.com/oraios/serena
        - serena
        - start-mcp-server
        - --context
        - ide-assistant
        - --project
        - ./
    - name: context7
      registry: false
      transport: stdio
      command: npx
      args:
        - -y
        - mcp-remote
        - https://context7.liam.sh/mcp
    - name: atlassian
      registry: false
      transport: stdio
      command: npx
      args:
        - -y
        - mcp-remote
        - https://mcp.atlassian.com/v1/sse
    - name: todoist
      registry: false
      transport: stdio
      command: npx
      args:
        - -y
        - mcp-remote
        - https://ai.todoist.net/mcp
includes: auto
scripts: {}
