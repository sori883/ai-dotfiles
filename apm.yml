name: ai-dotfiles
version: 1.0.0
description: APM project for ai-dotfiles
author: sori883
dependencies:
  apm: []
  mcp:
  - name: serena
    registry: false
    transport: stdio
    command: uvx
    args:
    - --from
    - git+https://github.com/oraios/serena
    - serena
    - start-mcp-server
    - --context
    - ide-assistant
    - --project
    - ./
  - name: context7
    registry: false
    transport: http
    url: https://context7.liam.sh/mcp
  - name: awslabs.aws-documentation-mcp-server
    registry: false
    transport: stdio
    command: uvx
    args:
    - awslabs.aws-documentation-mcp-server@latest
    env:
      FASTMCP_LOG_LEVEL: ERROR
  - name: atlassian
    registry: false
    transport: stdio
    command: npx
    args:
    - -y
    - mcp-remote
    - https://mcp.atlassian.com/v1/sse
  - name: todoist
    registry: false
    transport: stdio
    command: npx
    args:
    - -y
    - mcp-remote
    - https://ai.todoist.net/mcp
includes: auto
scripts: {}
